<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Portal - Vinod Photography</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0d0d0d 60%, #050505 100%);
            color: #f5f5f5;
            text-align: center;
            padding: 50px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-box {
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 60px;
            display: inline-block;
            margin-top: 50px;
            border-radius: 16px;
            background: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.05);
            transition: transform 0.3s ease;
        }

        .upload-box:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.6);
        }

        .btn {
            background-color: #d4af37;
            color: #000;
            padding: 18px 40px;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 30px;
            border-radius: 8px;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #e5c358;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        #qrResult {
            margin-top: 60px;
            display: none;
            animation: fadeIn 0.8s ease-out;
        }

        #qrImage {
            max-width: 380px;
            border: 20px solid white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            margin: 20px 0;
            transition: transform 0.4s ease;
        }

        #qrImage:hover {
            transform: scale(1.02);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 span {
            color: #d4af37;
            font-style: italic;
        }

        p.subtitle {
            color: #a0a0a0;
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="file"] {
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Vinod Photography <span>Print Station</span></h1>
    <p class="subtitle">Upload a photo to instantly generate the client QR code.</p>

    <div class="upload-box">
        <form id="uploadForm">
            <input type="file" id="photoInput" name="photo" accept="image/*" required
                style="font-size: 1.1rem; padding: 10px;">
            <br><br>
            <button type="submit" class="btn">Upload & Generate QR</button>
        </form>
        <p id="loadingText" style="display:none; color: #d4af37; margin-top: 20px;">Processing image...</p>
    </div>

    <div id="qrResult">
        <h2 style="color: #d4af37;">Show this QR Code to the Customer!</h2>
        <p>They can scan it with their phone camera to instantly view and download their photo.</p>
        <img id="qrImage" src="" alt="QR Code">
        <br><br>
        <p><a id="viewLink" href="#" target="_blank" style="color: #a0a0a0;">(Test Customer View Link)</a></p>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('photoInput');
            const file = fileInput.files[0];
            if (!file) return;

            const submitBtn = document.querySelector('.btn');
            const loadingText = document.getElementById('loadingText');

            submitBtn.disabled = true;
            loadingText.style.display = 'block';

            const formData = new FormData();
            formData.append('photo', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('qrImage').src = data.qr_url;
                    document.getElementById('viewLink').href = data.view_url;
                    document.getElementById('qrResult').style.display = 'block';
                } else {
                    alert('Upload failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error uploading:', error);
                alert('Upload failed! Serve may be offline.');
            } finally {
                submitBtn.disabled = false;
                loadingText.style.display = 'none';
                fileInput.value = ''; // format input for next upload
            }
        });
    </script>
</body>

</html>
