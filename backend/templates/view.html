<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photo - Vinod Photography</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0d0d0d 60%, #050505 100%);
            color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Ambient Orbs */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: #d4af37;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .header {
            background: rgba(13, 13, 13, 0.7);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        .logo span {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .photo-container {
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: slideUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .polaroid-frame {
            background-color: #fdfdfd;
            padding: 15px 15px 60px 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.03);
            display: inline-block;
            max-width: 100%;
            box-sizing: border-box;
            transform: rotate(-1deg);
            border-radius: 3px;
        }

        .polaroid-frame img {
            max-width: 100%;
            max-height: 55vh;
            border: 1px solid rgba(0, 0, 0, 0.1);
            object-fit: contain;
        }

        .caption {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #111;
            font-size: 1.5rem;
            margin-top: 15px;
        }

        .btn {
            display: inline-block;
            background-color: #d4af37;
            color: #000;
            padding: 18px 35px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 40px;
            letter-spacing: 1px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #e5c358;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        .footer {
            padding: 20px;
            font-size: 0.8rem;
            color: #a0a0a0;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="#" class="logo">Vinod Photography<span>.</span></a>
    </div>

    <div class="photo-container">
        <h2 style="font-family: 'Playfair Display', serif; color: #d4af37;">Here is your memory!</h2>
        <p style="margin-bottom: 30px; color: #a0a0a0;">Thank you for letting us capture your moment.</p>

        <div class="polaroid-frame">
            <img src="/image/{{ photo_id }}" alt="Your Instant Memory">
            <div class="caption">Vinod Photography</div>
        </div>

        <a href="/download/{{ photo_id }}" class="btn">Download High-Res Photo</a>
    </div>

    <div class="footer">
        &copy; 2026 Vinod Photography. All rights reserved.
    </div>
</body>

</html>
