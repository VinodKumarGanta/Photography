<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photo - Vinod Photography</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #050505;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        .logo span {
            color: #d4af37;
        }

        .photo-container {
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .polaroid-frame {
            background-color: #fff;
            padding: 15px 15px 60px 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: inline-block;
            max-width: 100%;
            box-sizing: border-box;
            transform: rotate(-2deg);
        }

        .polaroid-frame img {
            max-width: 100%;
            max-height: 60vh;
            border: 1px solid rgba(0, 0, 0, 0.1);
            object-fit: contain;
        }

        .caption {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #000;
            font-size: 1.5rem;
            margin-top: 15px;
        }

        .btn {
            display: inline-block;
            background-color: #d4af37;
            color: #000;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 40px;
            letter-spacing: 1px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #e5c358;
        }

        .footer {
            padding: 20px;
            font-size: 0.8rem;
            color: #a0a0a0;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="#" class="logo">Vinod Photography<span>.</span></a>
    </div>

    <div class="photo-container">
        <h2 style="font-family: 'Playfair Display', serif; color: #d4af37;">Here is your memory!</h2>
        <p style="margin-bottom: 30px; color: #a0a0a0;">Thank you for letting us capture your moment.</p>

        <div class="polaroid-frame">
            <img src="/image/{{ photo_id }}" alt="Your Instant Memory">
            <div class="caption">Vinod Photography</div>
        </div>

        <a href="/download/{{ photo_id }}" class="btn">Download High-Res Photo</a>
    </div>

    <div class="footer">
        &copy; 2026 Vinod Photography. All rights reserved.
    </div>
</body>

</html>
